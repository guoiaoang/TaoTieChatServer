// ==============================  FileService  ============================== //

// 文件上传接口
// 1. metadata 与文件内容分开存储，防止相同文件不同 metadata 导致显示相同的异常问题。
// 2. 上传时校验 metadata 及 md5 是否已存在，md5 存在但 metadata 不同时则只需上传新的 metadata，并生成新的文件 ID。
// 3. 存储时与用户关联，防止非法访问其他用户的文件。
// 4. 相同 metadata 可能是不同的文件内容，相同的 md5 可能是不同的 metadata。
// 5. md5 暂且认为不会冲突。
// 6. 实现秒传需要使用双向流，并合理设置超时时间防止服务器卡死，服务端要定时发送数据防止客户端超时断开连接。
service FileService {
  // GetFileID 获取文件 ID
  // 只校验，不更新
  // 文件内容存在时直接保存元数据
  rpc GetFileID(GetFileIDRequest) returns (GetFileIDReply) {}
  // FileUpload 上传文件
  // 客户端流式上传
  // 上传完成后获取文件的 ID，文件 ID 中主要关联了文件的 metadata
  // 使用双向流式上传时，服务端获取到文件信息返回一次是否需要上传的状态，上传完成后再返回一次上传完成的状态
  rpc FileUpload(stream FileUploadRequest) returns (stream FileUploadReply);
  // FileDownload 下载文件
  // 通过文件 ID 获取不同的 metadata 和文件内容
  rpc FileDownload(FileDownloadRequest) returns (stream FileDownloadReply);
}

// 获取文件上传状态 (是否已上传完成)，仅读取 md5
message GetFileIDRequest {
  optional  AuthRequest  request_user_auth = 1;  // 鉴权
            FileMetadata file_metadata     = 2;  // 文件元数据
}

// 文件元数据
message FileMetadata {
  string file_md5  = 1;
  string file_name = 2;
  int64  file_size = 3;
}

// 获取文件上传结果  // 获取文件上传 ID 时不需要获取已经上传的大小
message GetFileIDReply {
  optional  GetFileIDRequest request     = 1;  // 可选的原始请求信息字段
            Result           result      = 2;  // 状态信息字段
            string           file_id     = 3;  // 文件 ID
            FileStatusCode   file_status = 4;  // 文件状态
            string           message     = 5;  // 可选的错误消息字段
}

// 是谁因为什么原因要上传什么文件，以便后续关联消息等信息，防止垃圾文件的产生。
message FileUploadRequest {
  oneof data {
    FileUploadHeader header = 1;  // 第一条消息发送文件上传头信息（包含鉴权和文件元数据）
    FileChunkData    chunk  = 2;  // 后续消息发送文件碎片数据
  }
}

// 文件上传头信息
// 1. 鉴权信息：可用于防止非法访问
// 2. 文件元数据：用于关联文件 ID
// 3. 上传原因：用于记录文件上传的目的，便于垃圾清理。
// 上传时要求账号 ID 和文件 ID 均一致
message FileUploadHeader {
  optional  AuthRequest request_user_auth = 1;  // 鉴权  // 实际不需要
            string      file_id           = 2;  // 文件 ID
            string      reason            = 3;  // 上传原因
}

// 文件上传的数据部分
message FileChunkData {
  // string file_id = 1;  // 文件 ID
  int64 chunk_offset = 1;  // 当前分片在整个文件中的起始偏移量
  bytes chunk_data   = 2;  // 文件碎片数据
  // message chunk_info {
  //   int64 file_size    = 2;  // 文件总大小，用于校验上传完成
  //   int64 offset       = 3;  // 文件碎片在整个文件中的偏移位置
  //   int64 chunk_size   = 4;  // 当前碎片的大小
  //   int32 chunk_index  = 5;  // 当前碎片的索引，从 0 开始
  //   int32 total_chunks = 6;  // 碎片总数
  //   string file_md5    = 7;  // 文件 MD5，用于校验上传完成
  //   string chunk_md5   = 8;  // 当前碎片的 MD5，用于校验碎片数据的完整性
  // }
}

// 文件上传结果
message FileUploadReply {
  optional  FileUploadRequest request        = 1;  // 可选的原始请求信息字段
            Result            result         = 2;  // 状态信息字段
            FileStatusCode    file_status    = 3;  // 文件状态
            string            message        = 4;  // 可选的错误消息字段
            int64             uploaded_bytes = 5;  // 服务器已接收的字节数
}

// 文件下载请求
message FileDownloadRequest {
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      file_id           = 2;  // 文件 ID
            int64       downloaded_bytes  = 3;  // 客户端已接收的字节数
}

// 文件下载响应
message FileDownloadReply {
  oneof data {
    FileDownloadHeader header = 1;  // 第一条消息发送文件元数据（文件名、哈希等）
    FileChunkData      chunk  = 2;  // 后续消息发送文件碎片数据
  }
}

// 文件下载头信息
message FileDownloadHeader {
  optional  FileDownloadRequest request       = 1;  // 鉴权
            Result              result        = 2;  // 状态信息字段
            FileMetadata        file_metadata = 3;  // 文件元数据
            string              message       = 4;  // 可选的错误消息字段
            int64               offset        = 5;  // 文件大小异常时，告知客户端重置写入的位置
}

// =========================================================================== //
