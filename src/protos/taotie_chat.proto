package TaoTieChat;

// =========================================================================== //

// protobuf 不支持 enum 按位操作

// 在 C++ 中，Stub 是轻量级的，但 Channel 是重量级的，只要复用同一个 Channel 就是长连接。

// 客户端与服务端时间不一致时，收发消息可以使用雪花算法生成消息 ID，保证消息 ID 的唯一性和时间顺序性。
// 当前为简单程序，暂不考虑雪花算法与分布式、时间回调等情况，一切以服务端时间为准。

// Protobuf 有默认的消息大小限制（通常为 64MB 或 128MB，取决于实现），
// 建议每个 chunk_data 设置在 32KB 到 64KB 之间。这能平衡网络吞吐量和内存占用。
//
// gRPC 保证了 Stream 内部消息的顺序，服务器按接收顺序写入文件即可。
//
// 大量用户大规模上传建议服务器开启上传 URL 进行分片上传。

// > 使用 SQLite 时，官方文档曾做过测试：对于 100KB 以下 的数据，存入 SQLite 的 Blob 速度其实比直接读写文件系统快。
// 绝大多数关系型数据库（如 MySQL, PostgreSQL, SQL Server）的数据页大小通常是 8KB。
// 对于 8KB 到 1MB 的文本，可以存储为 BLOB/TEXT 类型。1MB 以上的内容强烈建议存储为文件。

// 缩短名称  // protobuf 不支持别名
message Timestamp{
  google.protobuf.Timestamp timestamp = 1;
}

// ===============================  ErrorCode  =============================== //

// 成功码
enum SuccessCode {
  option allow_alias = true;  // 允许不同名但同值的枚举值  // 没有重名会报错
  SUCCESS_UNSET  = 0x00000000;  // 未设置成功码
  // 成功
  SUCCESS        = 0x00000001;  // 成功
  STATUS_SUCCESS = 0x00000001;  // 成功
  STATUS_RUNNING = 0x00000001;  // 运行中
  STATUS_ONLINE  = 0x00000001;  // 在线
  SUCCESS_EMPTY  = 0x00000002;  // 无结果但不是错误
  SUCCESS_INIT   = 0x00000101;  // 返回初始值
}

// 错误码
enum ErrorCode {
  // option allow_alias = true;  // 允许不同名但同值的枚举值  // 没有重名会报错
  ERROR_UNSET                     = 0x00000000;  // 未设置错误码
  // 通用错误码  // 0x00000000 - 0x00000FFF
  UNKNOWN                         = 0x00000001;  // 未知错误
  DEFAULT                         = 0x00000002;  // 未知错误
  // grpc 相关的错误码  // 0x00001001 - 0x00001FFF
  ERROR_INIT                      = 0x00001001;  // 返回初始值
  ERROR_CONN                      = 0x00001002;  // QT 建立连接失败，无法触发 connect 动作
  ERROR_RECV                      = 0x00001003;  // 接收到的数据不完整或解析失败
  ERROR_SEND                      = 0x00001004;  // 发送数据失败
  // 数据库相关错误码  // 0x00002001 - 0x00002FFF
  DB_QUERY                        = 0x00002001;  // 数据库查询失败
  DB_QUERY_EMPTY                  = 0x00002002;  // 数据库查询为空
  DB_EXECUTE                      = 0x00002003;  // 数据库命令执行失败
  DB_EXECUTE_EMPTY                = 0x00002004;  // 数据库命令执行为空
  DB_CHECK                        = 0x00002005;  // 数据库数据插入检查失败
  DB_CHECK_EMPTY                  = 0x00002006;  // 数据库数据插入检查为空
  DB_RECORD_NOT_FOUND             = 0x00002007;  // 数据库记录未找到
  // 状态等相关错误码  // 0x00003001 - 0x00003FFF
  UNSUPPORTED                     = 0x00003001;  // 不支持的操作
  PENDING                         = 0x00003002;  // 待处理    // 如：好友请求待处理
  ACCEPTED                        = 0x00003003;  // 已接受    // 如：同意添加为好友
  IGNORED                         = 0x00003004;  // 忽略      // 如：不提醒该条消息
  REFUSED                         = 0x00003005;  // 拒绝      // 如：不同意添加为好友
  BLOCKED                         = 0x00003006;  // 被拉黑    // 如：被对方拉黑
  UNASSOCIATED                    = 0x00003101;  // 未关联    // 如：还不是好友
  ASSOCIATED                      = 0x00003102;  // 已关联    // 如：已经是好友
  PERMISSION_DENIED               = 0x00003103;  // 权限不足  // 如：没有权限访问文件
  // 单参数  // 0x00011011 - 0x00011FFF
  USER_ID_ERROR                   = 0x00011011;  //
  USER_ID_EMPTY                   = 0x00011012;  // 用户 ID 为空
  USER_ID_NOT_FOUND               = 0x00011013;  // 用户 ID 不存在
  USER_ID_EXISTS                  = 0x00011014;  // 用户 ID 已存在
  ACCOUNT_ID_ERROR                = 0x00011021;  //
  ACCOUNT_ID_EMPTY                = 0x00011022;  //
  ACCOUNT_ID_NOT_FOUND            = 0x00011023;  //
  PASSWORD_ERROR                  = 0x00011031;  //
  PASSWORD_EMPTY                  = 0x00011032;  // 密码为空
  PASSWORD_NOT_FOUND              = 0x00011033;  //
  TOKEN_ERROR                     = 0x00011041;  //
  TOKEN_EMPTY                     = 0x00011042;  // token 为空
  TOKEN_NOT_FOUND                 = 0x00011043;  //
  CONFIRM_PASSWORD_ERROR          = 0x00011051;  //
  CONFIRM_PASSWORD_EMPTY          = 0x00011052;  // 确认密码为空
  CONFIRM_PASSWORD_NOT_FOUND      = 0x00011053;  //
  SECURITY_QUESTION_ERROR         = 0x00011061;  //
  SECURITY_QUESTION_EMPTY         = 0x00011062;  // 安全问题为空
  SECURITY_QUESTION_NOT_FOUND     = 0x00011063;  //
  SECURITY_ANSWER_ERROR           = 0x00011071;  //
  SECURITY_ANSWER_EMPTY           = 0x00011072;  // 安全答案为空
  SECURITY_ANSWER_NOT_FOUND       = 0x00011073;  //
  // 目标错误  // 0x00012011 - 0x00012FFF
  TARGET_USER_ID_ERROR               = 0x00012011;  //
  TARGET_USER_ID_EMPTY               = 0x00012012;  // 目标用户 ID 为空
  TARGET_USER_ID_NOT_FOUND           = 0x00012013;  // 目标用户 ID 不存在
  TARGET_USER_ID_EXISTS              = 0x00012014;  // 目标用户 ID 已存在
  TARGET_ACCOUNT_ID_ERROR            = 0x00012021;  //
  TARGET_ACCOUNT_ID_EMPTY            = 0x00012022;  //
  TARGET_ACCOUNT_ID_NOT_FOUND        = 0x00012023;  //
  TARGET_PASSWORD_ERROR              = 0x00012031;  //
  TARGET_PASSWORD_EMPTY              = 0x00012032;  // 密码为空
  TARGET_PASSWORD_NOT_FOUND          = 0x00012033;  //
  TARGET_CONFIRM_PASSWORD_ERROR      = 0x00012051;  //
  TARGET_CONFIRM_PASSWORD_EMPTY      = 0x00012052;  // 确认密码为空
  TARGET_CONFIRM_PASSWORD_NOT_FOUND  = 0x00012053;  //
  TARGET_SECURITY_QUESTION_ERROR     = 0x00012061;  //
  TARGET_SECURITY_QUESTION_EMPTY     = 0x00012062;  // 安全问题为空
  TARGET_SECURITY_QUESTION_NOT_FOUND = 0x00012063;  //
  TARGET_SECURITY_ANSWER_ERROR       = 0x00012071;  //
  TARGET_SECURITY_ANSWER_EMPTY       = 0x00012072;  // 安全答案为空
  TARGET_SECURITY_ANSWER_NOT_FOUND   = 0x00012073;  //
  TARGET_GROUP_ID_ERROR              = 0x00012081;  //
  TARGET_GROUP_ID_EMPTY              = 0x00012082;  //
  TARGET_GROUP_ID_NOT_FOUND          = 0x00012083;  //
  // 聊天消息  // 0x00013011 - 0x00013FFF
  MESSAGE_TEXT_ERROR                 = 0x00013011;  //
  MESSAGE_TEXT_EMPTY                 = 0x00013012;  //
  MESSAGE_TEXT_NOT_FOUND             = 0x00013013;  //
  MESSAGE_FILE_ERROR                 = 0x00013021;  //
  MESSAGE_FILE_EMPTY                 = 0x00013022;  //
  MESSAGE_FILE_NOT_FOUND             = 0x00013023;  //
  MESSAGE_CONTEXT_ERROR              = 0x00013031;  //
  MESSAGE_CONTEXT_EMPTY              = 0x00013032;  // 消息内容为空
  MESSAGE_CONTEXT_NOT_FOUND          = 0x00013033;  //
  // 文件上传相关错误码  // 0x00004001 - 0x00004FFF
  FILE_READ_ERROR                    = 0x00014001;  // 文件读取错误
  FILE_WRITE_ERROR                   = 0x00014002;  // 文件写入失败
  FILE_REQUIRED                      = 0x00014003;  // 文件不能为空
  FILE_NOT_FOUND                     = 0x00014004;  // 文件未找到
  FILE_ID_REQUIRED                   = 0x00014005;  // 需要 file_id，但未提供
  FILE_HEADER_REQUIRED               = 0x00014006;  // 需要 header，但未提供
  FILE_NAME_EMPTY                    = 0x00014007;  // 文件名不能为空
  FILE_SIZE_INVALID                  = 0x00014008;  // 文件大小无效
  FILE_MD5_EMPTY                     = 0x00014009;  // 文件 MD5 不能为空
  FILE_MD5_MISMATCH                  = 0x00014010;  // 文件 MD5 校验失败
  FILE_UPLOAD_ERROR                  = 0x00014011;  // 文件上传失败
  FILE_DOWNLOAD_ERROR                = 0x00014012;  // 文件下载失败

  // 多参 // 0x00021011 - 0x00021FFF
  // 鉴权
  AUTH_INFO_NONE                  = 0x00021011;  // 没有必要的鉴权信息
  AUTH_ID_EMPTY                   = 0x00021012;  // ID 为空   // 无 user_id 及 account_id
  AUTH_METHOD_EMPTY               = 0x00021013;  // 方法为空  // 无 token 及 password
  AUTH_FAILED                     = 0x00021014;  // 鉴权失败
  DIFF_PASSWORD_WITH_CONFIRM      = 0x00021021;  // 确认密码与密码不一致
  TARGET_ID_REQUESTED             = 0x00021022;  // 多参 // 发送聊天消息时，需要提供目标 ID，但未提供
  CONTEXT_REQUIRED                = 0x00021023;  // 多参 // 发送聊天消息时，需要上下文信息，但未提供

  // 业务  // 0x00031011 - 0x00031FFF
  CLIENT_MESSAGE_ID_REQUIRED      = 0x10011011;  // 需要客户端消息 ID，但未提供
  DUPLICATE_MESSAGE_ID            = 0x10011012;  // 重复的客户端消息 ID
  FRIEND_REQUEST_NOT_FOUND        = 0x10011013;  // 好友请求未找到
}

// 直接使用 `IGNORE`会导致宏定义冲突
enum ContactReplyCode {
  CONTACT_REPLY_ACCEPT = 0;  // 同意
  CONTACT_REPLY_REJECT = 1;  // 拒绝
  CONTACT_REPLY_IGNORE = 2;  // 忽略
}

// 文件状态码
enum FileStatusCode {
  FILE_STATUS_NONE      = 0;  // 未设置
  FILE_STATUS_UPLOADED  = 1;  // 文件已上传完成
  FILE_STATUS_UPLOADING = 2;  // 文件正在上传中
  FILE_STATUS_NOT_FOUND = 3;  // 文件不存在
}

enum PermissionCode {
  PERMISSION_NONE    =  0;  // 0000 0000 // 无权限
  PERMISSION_CREATE  =  1;  // 0000 0001 //
  PERMISSION_READ    =  2;  // 0000 0010 //
  PERMISSION_WRITE   =  4;  // 0000 0100 //
  PERMISSION_MODIFY  =  8;  // 0000 1000 //
  PERMISSION_DELETE  = 16;  // 0001 0000 //
  PERMISSION_SHARE   = 32;  // 0010 0000 //
  PERMISSION_EXECUTE = 64;  // 0100 0000 //
}

// Result 结果消息
message Result {
  oneof code {
    ErrorCode   error_code   = 1;  // 错误码字段
    SuccessCode success_code = 2;  // 成功码字段
  }
  string        message      = 3;  // 可选的错误消息字段
}

// 用户信息列表
message ContactInfos {
    repeated ContactInfo contact_infos = 1;
}

// 自己相关的信息。
// 目前仅用于标志及存储，不用于信息的修改，仅作为账号登陆记录
message ContactInfoSelf {
  bool   modify_self_info  = 1;  // 是否是修改个人信息
  string user_id           = 2;  // 用户 ID
  string password          = 3;  // 密码
  string token             = 4;  // 认证令牌
  string security_question = 5;  // 安全问题
  string security_answer   = 6;  // 安全答案
}

// 好友相关的信息
message ContactInfoFriend {
            string account_id   = 1;  // 账号 ID  // 获取好友信息时由服务器填充该字段
            string user_id      = 2;  // 用户 ID  // 修改好友信息时使用该字段查找好友账号 ID
            int32  status       = 3;  // 是否被拉黑
            bool   starred      = 4;  // 是否标星
            bool   silent       = 5;  // 是否免打扰
            string notes        = 6;  // 备注
            string added_source = 7;  // 添加来源
            string added_time   = 8;  // 添加时间
  repeated  string tags         = 9;  // 标签，逗号分隔
}

// 用户的基本信息  // 公共信息
message ContactInfoBase {
            string account_id   = 1;  // 账号 ID
            string user_id      = 2;  // 用户 ID  // 修改个人用户 ID 时使用该字段作为目标用户 ID，修改好友 ID 时不使用该字段（不作为校验及目标 ID）
            string avatar_id    = 3;  // 头像
            string nickname     = 4;  // 昵称
            int32  gender       = 5;  // 性别  // 0: 未知 1: 男 2: 女
            string birthday     = 6;  // 生日
            string signature    = 7;  // 签名
            string region       = 8;  // 地区
            string description  = 9;  // 个人简介
  repeated  string phones       = 10;  // 手机号
  repeated  string emails       = 11;  // 邮箱
  repeated  string social_links = 12;  // 社交链接，逗号分隔
  repeated  string moments_id   = 13;  // 朋友圈 ID 列表
  repeated  string groups_id    = 14;  // 群组 ID 列表
}

// 用户信息
message ContactInfo {
  ContactInfoBase     base_info   = 1;  // 基本信息
  oneof               extra_info {
    ContactInfoSelf   self_info   = 2;  // 自己相关的信息
    ContactInfoFriend friend_info = 3;  // 好友相关的信息
  }
}

// 鉴权参数
message AuthRequest {
  oneof auth_id {
    string account_id = 1;
    string user_id    = 2;
  }
  oneof auth_method {
    string password = 3;  // 密码;  // 有 token 时就不要使用密码
    string token    = 4;  // 认证令牌
  }
}

// ============================  AccountService  ============================ //

// 用户注册服务
service AccountService {
  // Register 接收用户注册请求并返回注册结果。
  rpc SignUp(SignUpRequest) returns (SignUpReply) {}
  // 鉴权，实际为内部接口
  rpc AuthCheck(AuthRequest) returns (AuthReply) {}
  // UserLogin 接收用户登录请求并返回登录结果。
  rpc SignIn(SignInRequest) returns (SignInReply) {}
  // 添加联系人的申请
  rpc ContactRequest(ContactRequestRequest) returns (ContactRequestReply) {}
  // 添加联系人的回复
  rpc ContactReply(ContactReplyRequest) returns (ContactReplyReply) {}
  // 获取添加联系人申请的列表
  rpc GetContactRequests(AuthRequest) returns (GetContactRequestsReply) {}
  // // 添加联系人
  // rpc AddContact(AddContactRequest) returns (AddContactReply) {}
  // 更新个人资料  // 获取用户信息使用 `SearchService::SearchUser`
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileReply) {}
  // 获取安全问题 // 专用接口
  // 1.1. 通过密码修改密码时不需要获取安全问题
  // 1.2. 通过安全问题修改密码或通过安全问题修改安全问题时需要获取安全问题
  // 2.1. 密码找回时仅需提供用户 ID，无法提供身份验证
  // 实际只使用了 user_id 字段进行密保问题的查询。
  rpc GetSecurityQuestion(AuthRequest) returns (GetSecurityQuestionReply) {}
  // 更新用户安全信息
  // 1. 通过用户 ID 和密码修改密码
  // 2. 通过用户 ID 和密保问题修改密码，即找回账号
  // 3. 通过用户 ID 和密保问题修改密保问题
  // 不允许使用 token 进行安全资料的修改
  rpc UpdateSecurityInfo(UpdateSecurityInfoRequest) returns (UpdateSecurityInfoReply) {}
}

// 用户注册请求
message SignUpRequest {
  string user_id           = 1;  // 昵称
  string password          = 2;  // 密码
  string confirm           = 3;  // 确认密码  // 用于客户端
  string security_question = 4;  // 安全问题
  string security_answer   = 5;  // 安全答案
}

// 用户注册响应
message SignUpReply {
  optional  SignUpRequest request    = 1;  // 可选的原始请求信息字段
            Result        result     = 2;  // 状态信息字段
            string        account_id = 3;  // 注册成功后返回的账号 ID
}

// 鉴权结果
message AuthReply {
  optional  AuthRequest request    = 1;  // 可选的原始请求信息字段
            Result      result     = 2;  // 状态信息字段 // 校验结果也设置在这里
            string      account_id = 3;  // 如果传入的有则复制返回，否则返回获取到的
  optional  string      token      = 4;  // 如果传入的有则返回，否则不设置
}

// 用户登录请求  // 只有认证信息也要添加包装
message SignInRequest {
  AuthRequest request_user_auth = 1;  // 认证信息  // 必须
}

// 用户登录响应
message SignInReply {
  optional  SignInRequest request    = 1;  // 可选的原始请求信息字段
            Result        result     = 2;  // 状态信息字段
            string        account_id = 3;  // 登录成功后返回的账号 ID
            string        token      = 4;  // 登录成功后返回新获取的认证令牌
}

// 添加联系人的申请
message ContactRequestRequest {
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      target_user_id    = 2;  // 要添加的联系人 ID
  optional  string      message           = 3;  // 附带的消息
}
// 添加联系人申请的结果
message ContactRequestReply {
  optional  ContactRequestRequest request = 1;  // 可选的原始请求信息字段
            Result                result  = 2;  // 状态信息字段
  optional  string                message = 3;  // 附带的消息
}

// 被添加联系人的回复
message ContactReplyRequest {
  optional  AuthRequest      request_user_auth = 1;  // 鉴权
            string           target_user_id    = 2;  // 要添加的联系人 ID
  optional  string           message           = 3;  // 附带的消息
            ContactReplyCode reply             = 4;  // 回复结果
}
// 被添加联系人的回复的结果
message ContactReplyReply {
  optional  ContactReplyRequest request = 1;  // 可选的原始请求信息字段
            Result              result  = 2;  // 状态信息字段
  optional  string              message = 3;  // 附带的消息
}
// 获取添加联系人申请的列表
message GetContactRequestsReply {
  optional  AuthRequest  request_user_auth = 1;  // 鉴权
            Result       result            = 2;  // 状态信息字段
  repeated  ContactRequestInfo contact_request_info = 3;  // 联系人申请信息
}
// 联系人申请信息
message ContactRequestInfo {
  string    user_id   = 1;  // 申请人的用户 ID
  string    message   = 2;  // 附带的消息
  Timestamp timestamp = 3;  // 申请时间
}

// 更新个人资料
message UpdateProfileRequest {
  AuthRequest request_user_auth = 1;  // 认证信息  // 必须
  ContactInfo contact_info      = 2;  // 需要更新的个人资料信息
}

// 更新个人资料的结果
message UpdateProfileReply {
  optional  UpdateProfileRequest request = 1;  // 可选的原始请求信息字段
            Result               result  = 2;  // 状态信息字段
}

// 获取安全问题的结果
// 实际只使用 user_id 字段进行密保问题的查询，
// question 字段不为空即可认为该用户 ID 存在。
message GetSecurityQuestionReply {
  optional  AuthRequest request  = 1;  // 可选的原始请求信息字段
            Result      result   = 2;  // 状态信息字段
            string      question = 3;  // 安全问题
}

// 更新用户安全信息  // 修改密码、密保问题、找回账号等
// 不允许使用 token 进行安全资料的修改
// 1, 修改密码或找回账号必须提供密保信息
// 2, 修改密保信息必须提供密码
message UpdateSecurityInfoRequest {
  string user_id = 1;  // 必须要知道修改的是哪个用户的安全信息
  oneof old_auth {
    UpdateSecurityInfoOldSecurityInfo security_info_verify = 2;
    UpdateSecurityInfoOldPasswordInfo password_verify      = 3;
  }
  oneof new_auth {
    UpdateSecurityInfoNewPasswordInfo password_update      = 4;
    UpdateSecurityInfoNewSecurityInfo security_info_update = 5;
  }
}

// 子消息 // 旧认证信息  // 以安全问题校验的方式修改密码或修改安全问题时使用
message UpdateSecurityInfoOldSecurityInfo {
    string old_security_question = 1;  // 旧安全问题
    string old_security_answer   = 2;  // 旧安全答案
}

// 子消息 // 旧认证信息  // 以账号密码校验的方式修改密码时使用
message UpdateSecurityInfoOldPasswordInfo {
    string old_password = 1;  // 旧密码
}

// 子消息 // 新认证信息  // 修改密码时使用
message UpdateSecurityInfoNewPasswordInfo {
    string new_password = 1;  // 新密码
    string new_confirm  = 2;  // 新密码确认
}

// 子消息 // 新认证信息  // 修改安全问题时使用
message UpdateSecurityInfoNewSecurityInfo {
    string new_security_question = 1;  // 新安全问题
    string new_security_answer   = 2;  // 新安全答案
}

// 更新用户安全信息的结果
message UpdateSecurityInfoReply {
  optional  UpdateSecurityInfoRequest request = 1;  // 可选的原始请求信息字段
            Result                    result  = 2;  // 状态信息字段
}

// =============================  SearchService  ============================= //

// 搜索服务
service SearchService {
  // 搜索并获取陌生用户/好友信息
  rpc SearchUser(SearchUserRequest) returns (SearchUserReply) {}
  // 搜索群组
  rpc SearchGroup(SearchGroupRequest) returns (SearchGroupReply) {}
}

// 搜索用户需要的参数
message SearchUserRequest{
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      user_id           = 2;  // user_id/nickname/phone/email，其一即可
}

// 返回搜索用户的结果
message SearchUserReply{
  optional  SearchUserRequest request      = 1;  // 可选的原始请求信息字段  // “真”可选
            Result            result       = 2;  // 状态信息字段
  optional  ContactInfo       contact_info = 3;  // 用户/账号信息  // 搜索结果可以为空
}

// 搜索群组需要的参数
message SearchGroupRequest{
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      group_keyword     = 2;  // user_id/nickname/phone/email，其一即可
}

// 返回搜索群组的结果
message SearchGroupReply{
  optional  SearchGroupRequest request = 1;  // 鉴权
            Result             result  = 2;  // 状态信息字段
            Group              group   = 3;  // 群组信息  // 默认最多只返回 10 条信息 // 暂不设置可过滤或分页
}

//
message Groups {
    repeated Group group = 1;
}

// 群组的基本信息
message Group{
  string id        = 1;  // 群组 ID
  string name      = 2;  // 群组名称
  string avatar_id = 3;  // 头像 ID
  string signature = 4;  // 简介
  string region    = 5;  // 地区
}

// ============================== StatusService ============================== //

// 服务器在线状态及用户在线状态检查
service StatusService {
  // 返回给定请求的状态信息。
  rpc GetStatus (StatusRequest) returns (StatusReply) {}
}

// StatusRequest 要检查的用户或服务器 ID
message StatusRequest {
  optional  AuthRequest request_user_auth = 1;  //
            string      target_user_id    = 2;  // 被查询的用户 ID 或服务器 ID
}

// 最终的状态响应消息
message StatusReply {
  optional  StatusRequest request = 1;  // 可选的原始请求信息字段
            Result        result  = 2;  // 状态信息字段
            string        status  = 3;  // 自定义的用户状态字段
}

// ============================  MessageService  ============================ //

// 消息服务，包含发送和接收消息的接口
service MessageService {
  // 发送消息  // SendMessage 与 MSVC 中的同名函数何冲突
  rpc TTCSendMessage(MessageContext) returns (MessageReply) {}
  // 接收消息  // 双向流式 RPC，客户端发送 MessageRequest 请求，服务器持续返回 MessageContext 消息流
  rpc ReceiveMessages(MessageRequest) returns (stream MessageContext) {}
}

// 聊天消息中的消息类型
enum MessageType {
  SystemMessage = 0;  // 系统提示等消息
  ChatMessage   = 1;  // 用户聊天消息
}

// 消息上下文  // 发送消息时不要使用列表，每条消息都进行身份验证
message MessageContext {
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      sender_account_id = 2;  // 消息发送者的账号 ID
            string      client_message_id = 3;  // 客户端生成的消息 ID，用于判断消息是否重复发送
            Timestamp   timestamp         = 4;  // 客户端消息发送的时间  // 用于客户端时间校准，服务端不处理该时间戳
            MessageType message_type      = 5;  // 是否是系统消息
            // `oneof{}` 相比较与 `enum Type {...}`
            // 1. 更符合 protobuf 的设计理念。
            // 2. 仅占用一个位置。
            // 3. 语义明确，不会误设置 Type 导致混淆。
            oneof    chat_room {
              string account_id = 11;  // 私聊中接收者的账号 ID
              string group_id   = 12;  // 群聊 ID
            }
            // 消息内容均不能为空
            oneof    content {
              // 客户端需要注意不同字符串类型占用的空间大小不一致的问题
              string short_text   = 21;  // 短文本消息内容  // [0, 8192) 个字节以内的文本消息内容
              // FileContent long_text = 6;  // 长文本消息内容  // [8192, ...) 个字节以上的文本消息内容。
              // FileContent image     = 7;  // 图片消息内容
              // FileContent audio     = 8;  // 音频消息内容
              // FileContent video     = 9;  // 视频消息内容
              // FileContent file      = 10;  // 文件消息内容
              // 单内容格式/多内容格式，自定义格式/使用 xml
              // 通过特殊标记来区分文本和表情等非文本内容
              // `hello[::emoji::smaile]world[::img::earth.png],listen[::audio::hi.mp3]and view[::audio::heard.mp4]`
              // [] 中的内容表示特殊消息，格式为 `::type::data`，其中 type 可以是 emoji、img、audio、video、file 等，data 则是对应的内容，如表情名称、图片文件名、音频文件名等
              // MuiltMessage muilt_message = 11;  // 混合消息
            }
}

// 消息回应，返回服务端消息 ID 和时间戳，用于消息同步
message MessageReply {
  optional  MessageContext request           = 1;  // 可选的原始请求信息字段
            Result         result            = 2;  // 状态信息字段
            Timestamp      timestamp         = 3;  // 服务端接收到消息的时间
            // 服务端生成的全局唯一的消息 ID，用于消息同步
            // 目前为简单的服务器程序，仅单调递增即可，甚至可以使用 atom_int。
            string         server_message_id = 4;
            string         message           = 5;  // 可选的错误消息字段
}

// 消息请求
message MessageRequest {
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      target_id         = 2;  // 群聊 ID 或私聊 ID
            Timestamp   timestamp         = 3;  // 消息请求时间戳，由客户端设置，服务器可以选择使用或覆盖
}

// ============================  SyncService  ============================ //

// 客户端存储一张表，表中记录每个事件类型的最后一条消息的 ID，在程序启动时发送该表中的内容给服务器，
// 服务器检测到更新内容时发送更新消息。
// 没有更新消息时也需要携带信息告诉客户端无更新，而不是回复空的消息。

// 客户端启动时连接到服务器进行持续监听。
//   当有新事件时，服务端使用该接口通知客户端事件类型，
//   客户端根据事件类型发送本地对应事件类型的最后一条消息的 ID 给服务端，
//   服务端查找更新内容返回给客户端。

// TODO: 1. 添加 pts 表；2. 原表添加 pts_type 与 pts_id 字段。

// 更新事件服务，包含获取更新和监听更新的接口
service SyncService {
  // 获取是否有更新
  rpc GetLastID(AuthRequest) returns (GetLastIDReply) {}
  // 监听是否有新的消息
  // 双向流式 RPC，客户端发送 SyncRequest 请求，服务器持续返回 SyncReply 消息流
  // 服务端每次限制获取前 100 条消息并返回消息区间，由客户端判断消息范围进行同步
  rpc Sync(stream SyncRequest) returns (stream SyncReply) {}
}

// ------------------------------ 主子类型 enum ------------------------------ //

// 主类型及范围
message SyncTag {
  SyncType    type     = 1;  // 更新类型
  // SyncSubType sub_type = 2;  // 子类型
  int64       id_start = 3;  // 起始消息的 ID
  int64       id_end   = 4;  // 结束消息的 ID
  int64       count    = 5;  // 更新的消息数量
}

// 要获取更新的消息类型
enum SyncType {
  SYNC_UNSET    = 0;
  SYNC_CONTACTS = 1;  // 联系人列表
  SYNC_GROUPS   = 2;  // 群组列表
  SYNC_MESSAGES = 3;  // 消息列表
}

// 子类型
message SyncSubType{
  oneof sub_type{
    SyncSubTypeContact contact = 1;
    SyncSubTypeGroup   group   = 2;
    SyncSubTypeMessage message = 3;
  }
}

enum SyncSubTypeContact {
  SYNC_CONTACT_UNSET   = 0;
  SYNC_CONTACT_INFO    = 1;  // 联系人资料更新
  SYNC_CONTACT_REUQEST = 2;  // 好友申请
  SYNC_CONTACT_REPLY   = 3;  // 好友申请回复
  SYNC_CONTACT_SHIP    = 4;  // 好友关系变更
}

enum SyncSubTypeGroup {
  SYNC_GROUP_UNSET = 0;
}

enum SyncSubTypeMessage {
  SYNC_MESSAGE_UNSET = 0;
  SYNC_MESSAGE_TEXT  = 1;
}

// -------------------------------- GetLastID -------------------------------- //

// // 同步标签，包含要获取更新的消息类型和最后一条消息的 ID
// message GetLastIDTag {
//   SyncType type = 1;  // 更新类型
//   int64    id   = 2;  // 最后一条消息的 ID
// }

// 获取更新结果，包含每个消息类型的最后一条消息的 ID
message GetLastIDReply {
  optional  AuthRequest request = 1;  // 可选的原始请求信息字段
            Result      result  = 2;  // 状态信息字段
  repeated  SyncTag     tags    = 3;  // 同步标签，包含每个消息类型的最后一条消息的 ID
}

// ------------------- Sync SyncRequest & SyncReplyHeader ------------------- //

// 请求信息
message SyncRequest{
  optional  AuthRequest request_user_auth = 1;  // 鉴权  // 可能不需要
  repeated  SyncTag     sync_tag          = 2;  // 同步标签，包含要获取更新的消息类型和最后一条消息的 ID
}

// 连接认证结果
message SyncReplyHeader {
  optional  SyncRequest request = 1;  // 可选的原始请求信息字段
            Result      result  = 2;  // 状态信息字段
}

// 认证成功后返回的主要内容
message SyncReplyBody {
  SyncTag        tag   = 1;  // 同步标签，包含要获取更新的消息类型和最后一条消息的 ID
  oneof          info {
    // // 具体的更新消息，不同类型的字段由服务端按 tag.type 填充。
    // ContactInfos contact_infos = 3;  // 联系人列表更新内容
    // Groups       groups        = 4;  // 群组列表更新内容
    // Messages     messages      = 5;  // 消息列表更新内容
    // FileEvents   file_events   = 6;  // 文件事件列表更新内容
    SyncContacts contacts = 2;  // 账号相关消息
    SyncMessages messages = 3;  // 聊天内容消息
  }
}

// 返回内容
message SyncReply{
  oneof             reply {
    SyncReplyHeader header = 1;  // 同步回复头，包含请求信息和状态信息
    SyncReplyBody   body   = 2;  // 同步回复体，包含更新内容
  }
}

// ------------------------------ SyncContacts ------------------------------ //

// 同步账号相关信息
message SyncContacts {
  repeated SyncContact contact = 1;
}

// 同步账号相关信息
message SyncContact {
  SyncSubTypeContact   sub_type = 1;
  oneof info {
    SyncContactUpdate  update   = 2;  // 个人资料更新
    SyncContactRequest request  = 3;  // 发送了好友申请
    SyncContactReply   reply    = 4;  // 回复了好友申请
    SyncContactShip    ship     = 5;  // 好友关系变更
  }
}

// 账号信息更新
message SyncContactUpdate {
  ContactInfo contact_info = 1;
}

// 好友申请
message SyncContactRequest{
  ContactInfo contact_request = 1;
  string      time            = 2;
  string      message         = 3;
}

// 好友申请回复
message SyncContactReply{
  ContactInfo contact_reply   = 1;
  string      time            = 2;
  string      message         = 3;
}

// 好友关系变更
message SyncContactShip{
  ContactInfo contact = 1;
  // ...
}

// ------------------------------- SyncGroups ------------------------------- //

// 同步群组相关信息
message SyncGroups {
  repeated SyncGroup group = 1;
}

// 同步群组相关信息
message SyncGroup {
  SyncSubTypeGroup   sub_type = 1;
  oneof info {
    SyncGroupUpdate  update   = 2;  // 群组资料更新
    SyncGroupRequest request  = 3;  // 发送了群组申请
    SyncGroupReply   reply    = 4;  // 回复了群组申请
    SyncGroupShip    ship     = 5;  // 群组关系变更
  }
}

// 群组信息更新
message SyncGroupUpdate {
  Group group = 1;
}

// 群组申请
message SyncGroupRequest{
  Group  group   = 1;
  string time    = 2;
  string message = 3;
}

// 群组申请回复
message SyncGroupReply{
  Group  group   = 1;
  string time    = 2;
  string message = 3;
}

// 群组关系变更
message SyncGroupShip{
  Group group = 1;
  // ...
}

// ------------------------------ SyncMessages ------------------------------ //

// 同步消息相关信息  // 包括文件
message SyncMessages {
  repeated SyncMessage message = 1;
}

// 同步消息相关信息
message SyncMessage {
  SyncSubTypeMessage   sub_type            = 1;  // 消息子类型
  string               server_message_id   = 2;  // 服务端消息 ID
  string               client_message_id   = 3;  // 客户端消息 ID
  string               sender_account_id   = 4;  // 发送方账号 ID
  string               receiver_account_id = 6;  // 接收方账号 ID
  Timestamp            timestamp           = 7;  // 服务端落库时间
  oneof                info {
    SyncMessageText    text                = 8;  // 文本消息
  }
}

message SyncMessageText {
  oneof    info {
    string short_text        = 1;  // 文本消息内容
  }
}

// ------------------------------ SyncReplyBody ------------------------------ //

// // 单条消息增量事件
// message MessageEvent {
//   string server_message_id   = 1;  // 服务端消息 ID
//   string client_message_id   = 2;  // 客户端消息 ID
