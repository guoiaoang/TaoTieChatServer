//             Result            result  = 2;  // 状态信息字段
// }

// =============================  SearchService  ============================= //

// 搜索服务
service SearchService {
  // 搜索用户  // 公共信息，与好友列表不同
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersReply) {}
  // 搜索群组
  rpc SearchGroups(SearchGroupsRequest) returns (SearchGroupsReply) {}
}

// 搜索用户需要的参数
message SearchUsersRequest{
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      user_id           = 2;  // user_id/nickname/phone/email，其一即可
            string      user_filter       = 3;  // gender/region/birthday, 过滤条件
}

// 返回搜索用户的结果
message SearchUsersReply{
  optional  SearchUsersRequest request   = 1;  // 可选的原始请求信息字段
            Result             result    = 2;  // 状态信息字段
            Contacts           contacts  = 3;  // 用户/账号信息
}

message Contacts {
    repeated Contact contact = 1;
}

// 用户的基本信息  // 暂时设为都必须有
message Contact{
            string user_id  = 1;  // 用户 ID
            string nickname = 2;  // 昵称
            string avatar   = 3;  // 头像
            string sign     = 4;  // 签名
            int32  gender   = 5;  // 性别
            string region   = 6;  // 地区
            string birthday = 7;  // 生日
  repeated  string phones   = 8;  // 手机号
  repeated  string emails   = 9;  // 邮箱
}

// 搜索群组需要的参数
message SearchGroupsRequest{
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      groups_keyword    = 2;  // user_id/nickname/phone/email，其一即可
            string      groups_filter     = 3;  // gender/region/birthday, 过滤条件
}

// 返回搜索群组的结果
message SearchGroupsReply{
  optional  SearchGroupsRequest request = 1;  // 鉴权
            Result              result  = 2;  // 状态信息字段
            Groups              groups  = 3;  // 群组信息  // 默认最多只返回 10 条信息 // 暂不设置可过滤或分页
}

//
message Groups {
    repeated Group group = 1;
}

// 群组的基本信息
message Group{
  string id     = 1;  // 群组 ID
  string name   = 2;  // 群组名称
  string avatar = 3;  // 头像
  string sign   = 4;  // 简介
  string region = 5;  // 地区
}

// ============================== StatusService ============================== //

// 服务器在线状态及用户在线状态检查
service StatusService {
  // 返回给定请求的状态信息。
  rpc GetStatus (StatusRequest) returns (StatusReply) {}
}

// StatusRequest 要检查的用户或服务器 ID
message StatusRequest {
  optional  AuthRequest request_user_auth = 1;  //
            string      target_user_id    = 2;  // 被查询的用户 ID 或服务器 ID
}

// 最终的状态响应消息
message StatusReply {
  optional  StatusRequest request = 1;  // 可选的原始请求信息字段
            Result        result  = 2;  // 状态信息字段
            string        status  = 3;  // 自定义的用户状态字段
}

// ============================  MessageService  ============================ //

// 消息服务，包含发送和接收消息的接口
service MessageService {
  // 发送消息
  rpc SendMessage(MessageContext) returns (MessageReply) {}
  // 接收消息  // 双向流式 RPC，客户端发送 MessageRequest 请求，服务器持续返回 MessageContext 消息流
  rpc ReceiveMessages(MessageRequest) returns (stream MessageContext) {}
}

// 消息上下文  // 发送消息时不要使用列表，每条消息都进行身份验证
message MessageContext {
  optional  AuthRequest  request_user_auth = 1;  // 鉴权
            Timestamp    timestamp         = 2;  // 客户端消息发送的时间  // 用于客户端时间校准，服务端不处理该时间戳
            string       client_message_id = 3;  // 客户端生成的消息 ID，用于判断消息是否重复发送
            // `oneof{}` 相比较与 `enum Type {...}`
            // 1. 更符合 protobuf 的设计理念。
            // 2. 仅占用一个位置。
            // 3. 语义明确，不会误设置 Type 导致混淆。
            oneof         chat_room {
              string      group_id  = 4;  // 群聊 ID
              string      user_id   = 5;  // 私聊 ID
            }
            // 消息内容均不能为空
            oneof         content {
              // 客户端需要注意不同字符串类型占用的空间大小不一致的问题
              string      short_text   = 6;  // 短文本消息内容  // [0, 8192) 个字节以内的文本消息内容
              // FileContent long_text = 6;  // 长文本消息内容  // [8192, ...) 个字节以上的文本消息内容。
              // FileContent image     = 7;  // 图片消息内容
              // FileContent audio     = 8;  // 音频消息内容
              // FileContent video     = 9;  // 视频消息内容
              // FileContent file      = 10;  // 文件消息内容
              // 单内容格式/多内容格式，自定义格式/使用 xml
              // 通过特殊标记来区分文本和表情等非文本内容
              // `hello[::emoji::smaile]world[::img::earth.png],listen[::audio::hi.mp3]and view[::audio::heard.mp4]`
              // [] 中的内容表示特殊消息，格式为 `::type::data`，其中 type 可以是 emoji、img、audio、video、file 等，data 则是对应的内容，如表情名称、图片文件名、音频文件名等
              // MuiltMessage muilt_message = 11;  // 混合消息
            }
}

// 消息回应，返回服务端消息 ID 和时间戳，用于消息同步
message MessageReply {
  optional  MessageContext request           = 1;  // 可选的原始请求信息字段
            Result         result            = 2;  // 状态信息字段
            Timestamp      timestamp         = 3;  // 服务端接收到消息的时间
            // 服务端生成的全局唯一的消息 ID，用于消息同步
            // 目前为简单的服务器程序，仅单调递增即可，甚至可以使用 atom_int。
            string         server_message_id = 4;
            string         message           = 5;  // 可选的错误消息字段
}

message MessageRequest {
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      target_id         = 2;  // 群聊 ID 或私聊 ID
            Timestamp   timestamp         = 3;  // 消息请求时间戳，由客户端设置，服务器可以选择使用或覆盖
}

// ==============================  FileService  ============================== //

// 文件上传状态响应
service FileService {
  // 客户端流式上传
  // FileUpload 上传文件。
  rpc FileUpload(stream FileContent) returns (FileReply);
  // FileDownload 下载文件。
  rpc FileDownload(FileRequest) returns (stream FileContent);
}

// 文件上传请求
message FileContent {
  oneof data {
    FileMetadata metadata   = 1; // 第一条消息发送元数据（文件名、哈希等）
    bytes        chunk_data = 2; // 后续消息发送文件碎片
  }
}

// 文件元数据
message FileMetadata {
  string filename  = 1;
  int64  file_size = 2;
}

message FileReply {
  FileMetadata metadata = 1; // 第一条消息发送元数据（文件名、哈希等）
  Result       result  = 2;  // 状态信息字段
  int32        status_code = 3; // 状态码
  string       message = 4; // 可选的错误消息字段
}

message FileRequest {
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            FileMetadata metadata = 2; // 第一条消息发送元数据（文件名、哈希等）
}

