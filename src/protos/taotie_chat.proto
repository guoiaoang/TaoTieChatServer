package TaoTieChat;

// =========================================================================== //

// protobuf 不支持 enum 按位操作

// 在 C++ 中，Stub 是轻量级的，但 Channel 是重量级的，只要复用同一个 Channel 就是长连接。

// 客户端与服务端时间不一致时，收发消息可以使用雪花算法生成消息 ID，保证消息 ID 的唯一性和时间顺序性。
// 当前为简单程序，暂不考虑雪花算法与分布式、时间回调等情况，一切以服务端时间为准。

// Protobuf 有默认的消息大小限制（通常为 64MB 或 128MB，取决于实现），
// 建议每个 chunk_data 设置在 32KB 到 64KB 之间。这能平衡网络吞吐量和内存占用。
//
// gRPC 保证了 Stream 内部消息的顺序，服务器按接收顺序写入文件即可。
//
// 大量用户大规模上传建议服务器开启上传 URL 进行分片上传。

// > 使用 SQLite 时，官方文档曾做过测试：对于 100KB 以下 的数据，存入 SQLite 的 Blob 速度其实比直接读写文件系统快。
// 绝大多数关系型数据库（如 MySQL, PostgreSQL, SQL Server）的数据页大小通常是 8KB。
// 对于 8KB 到 1MB 的文本，可以存储为 BLOB/TEXT 类型。1MB 以上的内容强烈建议存储为文件。

// 缩短名称  // protobuf 不支持别名
message Timestamp{
  google.protobuf.Timestamp timestamp = 1;
}

// ===============================  ErrorCode  =============================== //

// 成功码
enum SuccessCode {
  option allow_alias = true;  // 允许不同名但同值的枚举值  // 没有重名会报错

  // 成功
  SUCCESS        = 0x00000000;  // 成功
  STATUS_SUCCESS = 0x00000000;  // 成功
  STATUS_RUNNING = 0x00000000;  // 运行中
  STATUS_ONLINE  = 0x00000000;  // 在线
  SUCCESS_INIT   = 0x00000101;  // 返回初始值
}

// 错误码
enum ErrorCode {
  // option allow_alias = true;  // 允许不同名但同值的枚举值  // 没有重名会报错

  UNSET                           = 0x00000000;  // 未设置错误码
  UNKNOWN                         = 0x00000001;  // 未知错误
  DEFAULT                         = 0x00000002;  // 未知错误
  // grpc 相关的错误码
  ERROR_INIT                      = 0x00001001;  // 返回初始值
  ERROR_CONN                      = 0x00001002;  // QT 建立连接失败，无法触发 connect 动作
  ERROR_RECV                      = 0x00001003;  // 接收到的数据不完整或解析失败
  ERROR_SEND                      = 0x00001004;  // 发送数据失败
  // 数据库相关错误码
  DB_QUERY                        = 0x00002001;  // 数据库查询失败
  DB_QUERY_EMPTY                  = 0x00002002;  // 数据库查询为空
  DB_EXECUTE                      = 0x00002003;  // 数据库命令执行失败
  DB_EXECUTE_EMPTY                = 0x00002004;  // 数据库命令执行为空
  DB_CHECK                        = 0x00002005;  // 数据库数据插入检查失败
  DB_CHECK_EMPTY                  = 0x00002006;  // 数据库数据插入检查为空
  DB_RECORD_NOT_FOUND             = 0x00002007;  // 数据库记录未找到
  // 状态等相关错误码
  UNSUPPORTED                     = 0x00003001;  // 不支持的操作
  PENDING                         = 0x00003002;  // 待处理    // 如：好友请求待处理
  ACCEPTED                        = 0x00003003;  // 已接受    // 如：同意添加为好友
  IGNORED                         = 0x00003004;  // 忽略      // 如：不提醒该条消息
  REFUSED                         = 0x00003005;  // 拒绝      // 如：不同意添加为好友
  BLOCKED                         = 0x00003006;  // 被拉黑    // 如：被对方拉黑
  UNASSOCIATED                    = 0x00003101;  // 未关联    // 如：还不是好友
  ASSOCIATED                      = 0x00003102;  // 已关联    // 如：已经是好友

  // 单参数
  USER_ID_ERROR                   = 0x00010101;  //
  USER_ID_EMPTY                   = 0x00010102;  // 用户 ID 为空
  USER_ID_NOT_FOUND               = 0x00010103;  // 用户 ID 不存在
  USER_ID_EXISTS                  = 0x00010104;  // 用户 ID 已存在
  ACCOUNT_ID_ERROR                = 0x00010201;  //
  ACCOUNT_ID_EMPTY                = 0x00010202;  //
  ACCOUNT_ID_NOT_FOUND            = 0x00010203;  //
  PASSWORD_ERROR                  = 0x00010301;  //
  PASSWORD_EMPTY                  = 0x00010302;  // 密码为空
  PASSWORD_NOT_FOUND              = 0x00010303;  //
  TOKEN_ERROR                     = 0x00010401;  //
  TOKEN_EMPTY                     = 0x00010402;  // token 为空
  TOKEN_NOT_FOUND                 = 0x00010403;  //
  CONFIRM_PASSWORD_ERROR          = 0x00010501;  //
  CONFIRM_PASSWORD_EMPTY          = 0x00010502;  // 确认密码为空
  CONFIRM_PASSWORD_NOT_FOUND      = 0x00010503;  //
  SECURITY_QUESTION_ERROR         = 0x00010601;  //
  SECURITY_QUESTION_EMPTY         = 0x00010602;  // 安全问题为空
  SECURITY_QUESTION_NOT_FOUND     = 0x00010603;  //
  SECURITY_ANSWER_ERROR           = 0x00010701;  //
  SECURITY_ANSWER_EMPTY           = 0x00010702;  // 安全答案为空
  SECURITY_ANSWER_NOT_FOUND       = 0x00010703;  //
  TARGET_USER_ID_ERROR            = 0x00010801;  //
  TARGET_USER_ID_EMPTY            = 0x00010802;  // 目标用户 ID 为空
  TARGET_USER_ID_NOT_FOUND        = 0x00010803;  // 目标用户 ID 不存在
  TARGET_USER_ID_EXISTS           = 0x00010804;  // 目标用户 ID 已存在
  TARGET_ACCOUNT_ID_ERROR         = 0x00010901;  //
  TARGET_ACCOUNT_ID_EMPTY         = 0x00010902;  //
  TARGET_ACCOUNT_ID_NOT_FOUND     = 0x00010903;  //
  TARGET_GROUP_ID_ERROR           = 0x00011001;  //
  TARGET_GROUP_ID_EMPTY           = 0x00011002;  //
  TARGET_GROUP_ID_NOT_FOUND       = 0x00011003;  //
  MESSAGE_TEXT_ERROR              = 0x00011101;  //
  MESSAGE_TEXT_EMPTY              = 0x00011102;  //
  MESSAGE_TEXT_NOT_FOUND          = 0x00011103;  //
  MESSAGE_FILE_ERROR              = 0x00011201;  //
  MESSAGE_FILE_EMPTY              = 0x00011202;  //
  MESSAGE_FILE_NOT_FOUND          = 0x00011203;  //
  // 多参
  DIFF_PASSWORD_WITH_CONFIRM      = 0x00020001;  // 确认密码与密码不一致
  TARGET_ID_REQUESTED             = 0x00020002;  // 需要目标 ID，但未提供
  CONTEXT_REQUIRED                = 0x00020003;  // 需要上下文信息，但未提供
  MESSAGE_CONTEXT_ERROR           = 0x00020101;  //
  MESSAGE_CONTEXT_EMPTY           = 0x00020102;  // 消息内容为空
  MESSAGE_CONTEXT_NOT_FOUND       = 0x00020103;  //

  //
  AUTH_INFO_NONE                  = 0x10010001;  // 没有必要的鉴权信息
  // 鉴权
  AUTH_ID_EMPTY                   = 0x10010002;  // ID 为空   // 无 user_id 及 account_id
  AUTH_METHOD_EMPTY               = 0x10010003;  // 方法为空  // 无 token 及 password
  AUTH_FAILED                     = 0x10010004;  // 鉴权失败

  // TODO:待移除
  // 用户登录相关错误码          // 0x010301DD 输入错误
  SIGNIN_INVALID_LOGIN_METHOD     = 0x10010101;  // 无效的登录方法
  // 用户登录相关错误码          // 0x010302DD 结果失败
  SIGNIN_AUTH_FAILED              = 0x10010102;  // 用户 ID 或密码或 token 等错误导致登录失败  // 请检查登录信息
  // 客户端消息发送
  CLIENT_MESSAGE_ID_REQUIRED      = 0x10010103;  // 需要客户端消息 ID，但未提供
  DUPLICATE_MESSAGE_ID            = 0x10010104;  // 重复的客户端消息 ID
  FRIEND_REQUEST_NOT_FOUND        = 0x10010105;  // 好友请求未找到
}

// Result 结果消息
message Result {
  oneof code {
    ErrorCode   error_code   = 1;  // 错误码字段
    SuccessCode success_code = 2;  // 成功码字段
  }
  string        message      = 3;  // 可选的错误消息字段
}
// ============================  AccountService  ============================ //

// 用户注册服务
service AccountService {
  // Register 接收用户注册请求并返回注册结果。
  rpc SignUp(SignUpRequest) returns (SignUpReply) {}
  // 鉴权，实际为内部接口
  rpc AuthCheck(AuthRequest) returns (AuthReply) {}
  // UserLogin 接收用户登录请求并返回登录结果。
  rpc SignIn(SignInRequest) returns (SignInReply) {}
  // 获取更新
  rpc GetUpdate(UpdateRequest) returns (UpdateReply) {}
  // 添加联系人的申请
  rpc ContactRequest(ContactRequestRequest) returns (ContactRequestReply) {}
  // 添加联系人的回复
  rpc ContactReply(ContactReplyRequest) returns (ContactReplyReply) {}
  // 获取添加联系人申请的列表
  rpc GetContactRequests(AuthRequest) returns (GetContactRequestsReply) {}
  // // 添加联系人
  // rpc AddContact(AddContactRequest) returns (AddContactReply) {}
}

// 用户注册请求
message SignUpRequest {
  string user_id           = 1;  // 昵称
  string password          = 2;  // 密码
  string confirm           = 3;  // 确认密码  // 用于客户端
  string security_question = 4;  // 安全问题
  string security_answer   = 5;  // 安全答案
}

// 用户注册响应
message SignUpReply {
  optional  SignUpRequest request    = 1;  // 可选的原始请求信息字段
            Result        result     = 2;  // 状态信息字段
            string        account_id = 3;  // 注册成功后返回的账号 ID
}

// 鉴权参数
message AuthRequest {
  oneof auth_id {
    string account_id = 1;
    string user_id    = 2;
  }
  oneof auth_method {
    string password = 3;  // 密码;  // 有 token 时就不要使用密码
    string token    = 4;  // 认证令牌
  }
}

// 鉴权结果
message AuthReply {
  optional  AuthRequest request    = 1;  // 可选的原始请求信息字段
            Result      result     = 2;  // 状态信息字段 // 校验结果也设置在这里
            string      account_id = 3;  // 如果传入的有则复制返回，否则返回获取到的
  optional  string      token      = 4;  // 如果传入的有则返回，否则不设置
}

// 用户登录请求  // 只有认证信息也要添加包装
message SignInRequest {
  AuthRequest request_user_auth = 1;  // 认证信息  // 必须
}

// 用户登录响应
message SignInReply {
  optional  SignInRequest request    = 1;  // 可选的原始请求信息字段
            Result        result     = 2;  // 状态信息字段
            string        account_id = 3;  // 登录成功后返回的账号 ID
            string        token      = 4;  // 登录成功后返回新获取的认证令牌
}

// 获取更新

// 要获取更新的消息类型
enum UpdateType {
  CONTACTS = 0;  // 联系人列表
  GROUPS   = 1;  // 群组列表
  MESSAGES = 2;  // 消息列表
}

// 请求信息
message UpdateRequest{
  optional  AuthRequest request_user_auth = 1;  // 鉴权  // 可能不需要
            UpdateType  type              = 2;  // 请求类型  // 主要
            Timestamp   timestamp         = 3;  // 获取该时间戳之后的新内容
}

// 返回内容
message UpdateReply{
  optional  UpdateRequest request     = 1;  // 可选的原始请求信息字段
            Result        result      = 2;  // 状态信息字段
            // SignInReply   auth_result = 3;  // 鉴权结果
  // 消息内容
  oneof                   body {
            Contacts      contacts = 3;
  }
}

// 添加联系人的申请
message ContactRequestRequest {
  optional  AuthRequest request_user_auth = 1;  // 鉴权
            string      target_user_id    = 2;  // 要添加的联系人 ID
  optional  string      message           = 3;  // 附带的消息
}
// 添加联系人申请的结果
message ContactRequestReply {
  optional  ContactRequestRequest request = 1;  // 可选的原始请求信息字段
            Result                result  = 2;  // 状态信息字段
  optional  string                message = 3;  // 附带的消息
}

// 直接使用 `IGNORE`会导致宏定义冲突
enum ContactReplyCode {
  CONTACT_REPLY_ACCEPT = 0;  // 同意
  CONTACT_REPLY_REJECT = 1;  // 拒绝
  CONTACT_REPLY_IGNORE = 2;  // 忽略
}

// 被添加联系人的回复
message ContactReplyRequest {
  optional  AuthRequest      request_user_auth = 1;  // 鉴权
            string           target_user_id    = 2;  // 要添加的联系人 ID
  optional  string           message           = 3;  // 附带的消息
            ContactReplyCode reply             = 4;  // 回复结果
}
// 被添加联系人的回复的结果
message ContactReplyReply {
  optional  ContactReplyRequest request = 1;  // 可选的原始请求信息字段
            Result              result  = 2;  // 状态信息字段
  optional  string              message = 3;  // 附带的消息
}

message GetContactRequestsReply {
  optional  AuthRequest  request_user_auth = 1;  // 鉴权
            Result       result            = 2;  // 状态信息字段
  repeated  ContactRequestInfo contact_request_info = 3;  // 联系人申请信息
}

message ContactRequestInfo {
  string    user_id   = 1;  // 申请人的用户 ID
  string    message   = 2;  // 附带的消息
  Timestamp timestamp = 3;  // 申请时间
}

// // 添加联系人
// // AuthRequest 没有添加 optional 字段，
// // 即使调用 has_request_user_auth() ，
// // 然后再使用 has_request_user_auth() 判断，也依然返回 true。
// message AddContactRequest {
//   AuthRequest request_user_auth = 1;  // 鉴权
